<div style="width: 390px; height: 844px; background: #000000; display: flex; flex-direction: column; overflow: hidden;">

          <circle cx="35" cy="30" r="16" stroke="#FF3B30" stroke-width="3"/>
          <circle cx="35" cy="30" r="4" fill="#FF3B30"/>
        </svg>
        <div style="position: absolute; left: 128px; top: 112px; background: rgba(0,0,0,.72); color: #fff; font-size: 12px; padding: 5px 10px; border-radius: 999px;">Рюкзак у камня</div>

      <!-- индикатор прокрутки полосы -->
      <div style="display: flex; justify-content: center; gap: 4px; padding-top: 10px;">
        <div style="width: 40px; height: 3px; border-radius: 2px; background: #007AFF;"></div>
        <div style="width: 40px; height: 3px; border-radius: 2px; background: #3A3A3C;"></div>
        <div style="width: 40px; height: 3px; border-radius: 2px; background: #3A3A3C;"></div>

    </div>

    <!-- Штамп панорамы -->
    <div style="margin: 0 24px; padding: 16px; border-radius: 32px; background: rgba(0,0,0,0.70); color: #FFFFFF; font-size: 13px; line-height: 20px; display: flex; flex-direction: column;">
      <span>55.755826</span>
      <span>37.617300</span>
      <span>Точность 4 м · обзор 214°</span>
      <div style="display: flex; gap: 8px;"><span>03.09.2026</span><span>15:34</span></div>

    <span style="font-size: 24px; color: #007AFF;">Отметить объект</span>

    <div style="display: flex; gap: 12px;">
