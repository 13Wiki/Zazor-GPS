<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: Manrope, "Segoe UI", system-ui, sans-serif; }
    a { color: #2F86F6; } a:hover { color: #1c6ed6; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0B0F14; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <div style="padding: 20px 16px 0; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;">
    <div style="width: 46px; height: 46px; border-radius: 999px; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center;">
      <span style="font-size: 16px; font-weight: 700; color: #FFFFFF;">Панорама</span>
      <span style="font-size: 12px; font-weight: 600; color: #34D07F;">обзор 214°</span>
    </div>
    <div style="width: 46px; height: 46px;"></div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px;">

    <!-- Сшитая полоса -->
    <div>
      <div style="height: 210px; position: relative; overflow: hidden; background: linear-gradient(180deg, #5c6f80 0%, #47596a 30%, #46543f 52%, #333f2a 100%);">
        <div style="position: absolute; left: 18px; top: 68px; width: 84px; height: 48px; border-radius: 50% 50% 40% 40%; background: #3b4a35;"></div>
        <div style="position: absolute; left: 148px; top: 48px; width: 116px; height: 68px; border-radius: 50% 50% 44% 44%; background: #44543c;"></div>
        <div style="position: absolute; left: 300px; top: 72px; width: 76px; height: 44px; border-radius: 50% 50% 40% 40%; background: #3b4a35;"></div>
        <div style="position: absolute; left: 64px; top: 150px; width: 58px; height: 32px; border-radius: 30px 26px 22px 28px; background: #7d8579;"></div>

        <!-- Метка объекта -->
        <svg style="position: absolute; left: 56px; top: 104px;" width="74" height="92" viewBox="0 0 74 92" fill="none">
          <path d="M37 84V46" stroke="#FF5A4E" stroke-width="4" stroke-linecap="round"/>
          <circle cx="37" cy="31" r="17" stroke="#FF5A4E" stroke-width="4"/>
          <circle cx="37" cy="31" r="5" fill="#FF5A4E"/>
        </svg>
        <div style="position: absolute; left: 136px; top: 122px; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.26); backdrop-filter: blur(20px);">
          <span style="font-size: 13px; font-weight: 600; color: #FFFFFF;">Рюкзак у камня</span>
        </div>
      </div>

      <div style="display: flex; justify-content: center; gap: 5px; padding-top: 14px;">
        <div style="width: 44px; height: 4px; border-radius: 2px; background: #2F86F6;"></div>
        <div style="width: 44px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.18);"></div>
        <div style="width: 44px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.18);"></div>
      </div>
    </div>

    <!-- Подпись, которая ляжет на снимок -->
    <div style="margin: 0 16px; padding: 18px 20px; border-radius: 26px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="width: 34px; height: 34px; border-radius: 12px; background: #2F86F6; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 6-9 12-9 12S3 16 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        </div>
        <div style="display: flex; flex-direction: column;">
          <span style="font-size: 16px; font-weight: 700; color: #FFFFFF;">55.755826, 37.617300</span>
          <span style="font-size: 13px; font-weight: 500; color: rgba(255,255,255,.6);">Ленинский просп. 32, Москва</span>
        </div>
      </div>
      <div style="display: flex; gap: 8px;">
        <div style="padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,.1);"><span style="font-size: 12px; font-weight: 600; color: rgba(255,255,255,.85);">03.09.2026</span></div>
        <div style="padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,.1);"><span style="font-size: 12px; font-weight: 600; color: rgba(255,255,255,.85);">15:34</span></div>
        <div style="padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,.1);"><span style="font-size: 12px; font-weight: 600; color: rgba(255,255,255,.85);">±4 м</span></div>
      </div>
    </div>
  </div>

  <div style="padding: 0 16px 30px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px;">
    <p style="margin: 0; font-size: 13px; line-height: 19px; color: rgba(255,255,255,.55);">Коснитесь панорамы, чтобы поставить метку. Координаты и обзор нанесутся на снимок — в файле их не останется.</p>
    <div style="display: flex; gap: 12px;">
      <div style="flex-grow: 1; height: 54px; border-radius: 18px; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 6-9 12-9 12S3 16 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span style="font-size: 15px; font-weight: 600; color: #FFFFFF;">Метка</span>
      </div>
      <div style="flex-grow: 1; height: 54px; border-radius: 18px; background: #2F86F6; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: 15px; font-weight: 700; color: #FFFFFF;">Сохранить</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
