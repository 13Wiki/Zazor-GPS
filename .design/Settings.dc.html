<!doctype html>
<html>

<x-dc>

  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0B0F14; display: flex; flex-direction: column; overflow: hidden;">

          <span style="font-size: 13px; color: rgba(255,255,255,.4);">Градусы</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
        </div>
        <div style="height: 1px; background: rgba(255,255,255,.07);"></div>
        <div style="padding: 15px 0; display: flex; align-items: center; gap: 13px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5CA4FF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M21 10c0 6-9 12-9 12S3 16 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>

            <span style="font-size: 12px; color: rgba(255,255,255,.42);">Предупредить, если хуже 10 м</span>

          <div style="width: 51px; height: 31px; border-radius: 999px; background: #34D07F; display: flex; align-items: center; justify-content: flex-end; padding: 2px; flex-shrink: 0;">
            <div style="width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF;"></div>
          </div>
        </div>
      </div>

      <div style="border-radius: 20px; background: rgba(255,255,255,.05); padding: 0 16px;">

          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5CA4FF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>

            <span style="font-size: 12px; color: rgba(255,255,255,.42);">Значок, подпись, стирающий код</span>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
        </div>
        <div style="height: 1px; background: rgba(255,255,255,.07);"></div>
        <div style="padding: 15px 0; display: flex; align-items: center; gap: 13px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5CA4FF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M12 3 4 6v6c0 5 3.4 8.6 8 10 4.6-1.4 8-5 8-10V6z"/></svg>
          <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
            <span style="font-size: 15px; font-weight: 600; color: #FFFFFF;">Приватность и статистика</span>
            <span style="font-size: 12px; color: rgba(255,255,255,.42);">Что уходит с телефона</span>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
        </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 12px; font-weight: 800; letter-spacing: .06em; color: rgba(255,255,255,.42);">ПРОЧЕЕ</span>
      <div style="border-radius: 20px; background: rgba(255,255,255,.05); padding: 0 16px;">
        <div style="padding: 15px 0; display: flex; align-items: center; gap: 13px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5CA4FF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="m12 3 2.6 5.6 6.4.8-4.7 4.3 1.2 6.3-5.5-3-5.5 3 1.2-6.3L3 9.4l6.4-.8z"/></svg>
          <span style="font-size: 15px; font-weight: 600; color: #FFFFFF; flex-grow: 1;">Убрать рекламу</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>

          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
        </div>
      </div>
    </div>
