<!doctype html>
<html>

<x-dc>

<div style="width: 390px; height: 844px; background: #070908; position: relative; overflow: hidden;">

  <div style="position: absolute; left: 52px; top: 556px; width: 96px; height: 56px; border-radius: 44px 36px 32px 40px; background: #7b8377;"></div>

  <!-- Верхний ряд: приборные чипы, без сплошной панели -->

      </div>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; color: #FFFFFF;">4.0 м</span>
    </div>

    <div style="display: flex; gap: 8px;">
      <div style="width: 40px; height: 40px; border-radius: 10px; background: rgba(10,12,11,.62); border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(14px); display: flex; align-items: center; justify-content: center;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg>

        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
      </div>
    </div>
  </div>

  <!-- Приборный уровень по левому краю -->
  <div style="position: absolute; left: 16px; top: 300px; display: flex; flex-direction: column; align-items: center; gap: 5px;">
    <div style="width: 1px; height: 30px; background: rgba(255,255,255,.2);"></div>
    <div style="width: 11px; height: 2px; background: rgba(255,255,255,.34);"></div>
    <div style="width: 17px; height: 2px; background: #FFC043;"></div>
    <div style="width: 11px; height: 2px; background: rgba(255,255,255,.34);"></div>
    <div style="width: 1px; height: 30px; background: rgba(255,255,255,.2);"></div>
  </div>

  <!-- Приборный вывод координат: моноширинные цифры не прыгают при обновлении -->
  <div style="position: absolute; left: 16px; top: 96px; padding: 14px 16px; border-radius: 14px; background: rgba(7,9,8,.72); border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(18px); display: flex; flex-direction: column; gap: 9px;">
    <div style="display: flex; gap: 22px;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 9px; font-weight: 600; letter-spacing: .14em; color: #FFC043;">ШИРОТА</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 500; color: #FFFFFF;">55.755826</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 9px; font-weight: 600; letter-spacing: .14em; color: #FFC043;">ДОЛГОТА</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 500; color: #FFFFFF;">37.617300</span>
      </div>
    </div>
    <div style="height: 1px; background: rgba(255,255,255,.14);"></div>
    <div style="display: flex; gap: 22px;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 9px; font-weight: 600; letter-spacing: .14em; color: rgba(255,255,255,.5);">ДАТА · ВРЕМЯ</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #FFFFFF;">03.09.2026 15:30</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 9px; font-weight: 600; letter-spacing: .14em; color: rgba(255,255,255,.5);">ТОЧНОСТЬ</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #FFFFFF;">±4 м</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 7px; padding-top: 1px;">
      <div style="width: 4px; height: 4px; border-radius: 50%; background: #FFC043;"></div>
      <span style="font-size: 12px; color: rgba(255,255,255,.86);">Камень у просеки, 40 м на СВ</span>
    </div>
  </div>

  <!-- Отметки на кадре -->
  <svg style="position: absolute; left: 64px; top: 524px;" width="72" height="72" viewBox="0 0 72 72" fill="none"><circle cx="36" cy="36" r="26" stroke="#FF4438" stroke-width="3"/></svg>
  <svg style="position: absolute; left: 128px; top: 432px;" width="104" height="104" viewBox="0 0 104 104" fill="none" stroke="#FF4438" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M94 12 28 78"/><path d="M28 52v26h26"/></svg>

  <!-- Нижние органы управления поверх кадра -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 20px 30px; background: linear-gradient(180deg, rgba(7,9,8,0) 0%, rgba(7,9,8,.82) 46%, #07090884 100%); display: flex; flex-direction: column; gap: 20px;">

    <div style="display: flex; justify-content: center; gap: 28px; align-items: baseline; padding-top: 56px;">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: .1em; color: rgba(255,255,255,.44);">КОЛЛАЖ</span>
      <span style="font-size: 13px; font-weight: 700; letter-spacing: .1em; color: #FFC043;">ФОТО</span>
      <span style="font-size: 12px; font-weight: 600; letter-spacing: .1em; color: rgba(255,255,255,.44);">ПАНОРАМА</span>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="width: 52px; height: 52px; border-radius: 12px; background: linear-gradient(150deg, #55634f, #29331f); border: 1px solid rgba(255,255,255,.22);"></div>

      <div style="width: 76px; height: 76px; border-radius: 50%; border: 3px solid rgba(255,255,255,.9); display: flex; align-items: center; justify-content: center;">
        <div style="width: 60px; height: 60px; border-radius: 50%; background: #FFC043;"></div>
      </div>

      <div style="width: 52px; height: 52px; border-radius: 12px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.1 21 6l-4 3.9"/><path d="M3 12v-1a5 5 0 0 1 5-5h13"/><path d="M7 21.9 3 18l4-3.9"/><path d="M21 12v1a5 5 0 0 1-5 5H3"/></svg>
      </div>
    </div>
  </div>
</div>
