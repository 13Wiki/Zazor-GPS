<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: Manrope, "Segoe UI", system-ui, sans-serif; }
    a { color: #2F86F6; } a:hover { color: #1c6ed6; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0B0F14; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 20px 16px 14px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 46px; height: 46px; border-radius: 999px; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      </div>
      <span style="font-size: 24px; font-weight: 800; color: #FFFFFF; letter-spacing: -.02em;">Выходы</span>
    </div>
    <div style="width: 46px; height: 46px; border-radius: 999px; background: rgba(255,90,78,.16); display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF7A70" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7v13a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7"/></svg>
    </div>
  </div>

  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 12px;">

    <!-- Сегодня -->
    <div style="border-radius: 24px; background: rgba(255,255,255,.06); overflow: hidden;">
      <div style="height: 116px; position: relative; background: #16201C;">
        <svg style="position: absolute; inset: 0;" width="358" height="116" viewBox="0 0 358 116" fill="none" preserveAspectRatio="none">
          <path d="M-10 60 C 60 70, 110 30, 190 44 S 320 84, 370 60" stroke="#2C3830" stroke-width="10" fill="none"/>
          <path d="M40 92 L96 62 L152 74 L214 40 L280 26" stroke="#2F86F6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.18"/>
          <path d="M40 92 L96 62 L152 74 L214 40 L280 26" stroke="#2F86F6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="40" cy="92" r="5" fill="#0B0F14" stroke="#2F86F6" stroke-width="2.5"/>
          <circle cx="96" cy="62" r="5" fill="#0B0F14" stroke="#2F86F6" stroke-width="2.5"/>
          <circle cx="152" cy="74" r="5" fill="#0B0F14" stroke="#2F86F6" stroke-width="2.5"/>
          <circle cx="214" cy="40" r="5" fill="#0B0F14" stroke="#2F86F6" stroke-width="2.5"/>
          <circle cx="280" cy="26" r="6" fill="#FF5A4E" stroke="#0B0F14" stroke-width="2.5"/>
        </svg>
        <div style="position: absolute; left: 12px; top: 12px; padding: 6px 12px; border-radius: 999px; background: rgba(11,15,20,.7); backdrop-filter: blur(14px);">
          <span style="font-size: 12px; font-weight: 700; color: #FFFFFF;">Сегодня</span>
        </div>
      </div>
      <div style="padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 15px; font-weight: 700; color: #FFFFFF;">5 точек · 2,4 км</span>
          <span style="font-size: 12px; color: rgba(255,255,255,.5);">14:22 — 15:34 · Ленинский просп.</span>
        </div>
        <div style="display: flex; gap: 8px;">
          <div style="width: 40px; height: 40px; border-radius: 13px; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7v13a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7"/></svg>
          </div>
          <div style="width: 40px; height: 40px; border-radius: 13px; background: #2F86F6; display: flex; align-items: center; justify-content: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4"/><path d="m15.4 6.5-6.8 4"/></svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Вчера -->
    <div style="border-radius: 24px; background: rgba(255,255,255,.06); overflow: hidden;">
      <div style="height: 116px; position: relative; background: #16201C;">
        <svg style="position: absolute; inset: 0;" width="358" height="116" viewBox="0 0 358 116" fill="none" preserveAspectRatio="none">
          <path d="M-10 40 C 70 20, 130 80, 210 66 S 330 30, 370 48" stroke="#2C3830" stroke-width="10" fill="none"/>
          <path d="M64 30 L118 58 L176 52 L232 86" stroke="#2F86F6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.18"/>
          <path d="M64 30 L118 58 L176 52 L232 86" stroke="#2F86F6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="64" cy="30" r="5" fill="#0B0F14" stroke="#2F86F6" stroke-width="2.5"/>
          <circle cx="118" cy="58" r="5" fill="#0B0F14" stroke="#2F86F6" stroke-width="2.5"/>
          <circle cx="176" cy="52" r="5" fill="#0B0F14" stroke="#2F86F6" stroke-width="2.5"/>
          <circle cx="232" cy="86" r="6" fill="#FF5A4E" stroke="#0B0F14" stroke-width="2.5"/>
        </svg>
        <div style="position: absolute; left: 12px; top: 12px; padding: 6px 12px; border-radius: 999px; background: rgba(11,15,20,.7); backdrop-filter: blur(14px);">
          <span style="font-size: 12px; font-weight: 700; color: #FFFFFF;">2 сентября</span>
        </div>
      </div>
      <div style="padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 15px; font-weight: 700; color: #FFFFFF;">4 точки · 1,1 км</span>
          <span style="font-size: 12px; color: rgba(255,255,255,.5);">10:40 — 11:08 · Балашиха</span>
        </div>
        <div style="display: flex; gap: 8px;">
          <div style="width: 40px; height: 40px; border-radius: 13px; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7v13a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7"/></svg>
          </div>
          <div style="width: 40px; height: 40px; border-radius: 13px; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4"/><path d="m15.4 6.5-6.8 4"/></svg>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Как устроено удаление -->
  <div style="margin: 16px 16px 0; padding: 15px 16px; border-radius: 20px; background: rgba(255,90,78,.09); display: flex; gap: 11px; align-items: flex-start;">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FF7A70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; margin-top:1px;"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7v13a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7"/></svg>
    <span style="font-size: 12px; line-height: 18px; color: #FFB3AC;">Маршрут не хранится отдельно — он собирается из снимков. Удалили снимки за день, и след того дня исчез вместе с ними. Отдельная кнопка стирает весь выход целиком.</span>
  </div>
</div>
</x-dc>
</body>
</html>
