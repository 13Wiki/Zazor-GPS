plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace 'com.gps.zazor'
    compileSdk 36

    defaultConfig {
        applicationId "com.gps.zazor"
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName "2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary true

        // The Ads SDK reads the app id from the manifest and kills the process on startup if it is
        // missing, so it is a placeholder rather than something that can be forgotten.
        manifestPlaceholders = [admobAppId: project.findProperty("zazor.admob.appId") ?: ""]
        buildConfigField "String", "ADMOB_BANNER_UNIT_ID",
                "\"${project.findProperty("zazor.admob.bannerUnitId") ?: ""}\""
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    signingConfigs {
        /*
         * The real upload key is described by keystore.properties in the project root, which is
         * git-ignored and never leaves the machine that holds the key: losing it means losing the
         * ability to publish updates for this app, forever.
         *
         * Without that file the build falls back to the debug key, so a fresh checkout still
         * produces an installable APK for testing. Play rejects debug-signed uploads, and
         * `verifyReleaseSigning` below fails the build before you waste an upload finding out.
         */
        release {
            def keystoreProps = new Properties()
            def keystoreFile = rootProject.file("keystore.properties")
            if (keystoreFile.exists()) {
                keystoreFile.withInputStream { keystoreProps.load(it) }
                storeFile file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            } else {
                storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        debug {
            // No applicationIdSuffix: google-services.json only registers com.gps.zazor, and a
            // suffixed id makes the Google Services plugin fail the build.
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        // java.time on API 24-25 comes from the desugared JDK libraries rather than the platform.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    def room_version = "2.8.4"
    def camerax_version = "1.6.2"
    def koin_version = "3.5.6"

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.8.7'

    implementation "io.insert-koin:koin-android:$koin_version"

    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    // Camera2 interop: CameraX has no "ultra-wide" concept, so the lenses are inspected directly.
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.ernestoyaquello.dragdropswiperecyclerview:drag-drop-swipe-recyclerview:1.1.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.android.billingclient:billing-ktx:8.0.0'
    implementation 'com.google.android.gms:play-services-ads:25.4.0'

    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-crashlytics-ktx'
    // Analytics carries the owner's anonymous counters. The advertising id it would normally
    // collect is stripped in the manifest - nothing here should follow anyone between apps.
    implementation 'com.google.firebase:firebase-analytics-ktx'

    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

/*
 * A debug-signed bundle is rejected by Play with an error that does not name the cause. Fail here
 * instead, where the message can say what to do about it.
 */
tasks.matching { it.name == "bundleRelease" }.configureEach {
    doFirst {
        if (!rootProject.file("keystore.properties").exists()) {
            throw new GradleException(
                "bundleRelease needs a real upload key.\n" +
                "Create one, then write keystore.properties in the project root:\n" +
                "  storeFile=/absolute/path/to/zazor-upload.jks\n" +
                "  storePassword=...\n" +
                "  keyAlias=zazor\n" +
                "  keyPassword=...\n" +
                "See RELEASE.md. assembleRelease still works without it, for testing only."
            )
        }
    }
}
