org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

kotlin.code.style=official

# Maven Central occasionally answers 429 behind a shared egress IP; retry with backoff.
systemProp.org.gradle.internal.repository.max.tentatives=10
systemProp.org.gradle.internal.repository.initial.backoff=2000

# AdMob. The app id is Google's official *test* identifier: the Ads SDK reads it at process start
# and refuses to run without a well-formed one, so it is never left blank. Replace it with the
# owner's own id when ads are switched on.
#
# The banner unit id is deliberately empty, and that is the switch: with no unit id AdSlot reports
# itself unavailable, no ad is ever requested and the gallery shows none. The first release ships
# this way on purpose - a brand new AdMob account should not see its first traffic from a build
# that is still being tested, and ads in week one are what first reviews punish. Turning ads on is
# one line here plus a version bump; the code, the layout and the Pro purchase are already in place.
zazor.admob.appId=ca-app-pub-3940256099942544~3347511713
zazor.admob.bannerUnitId=
