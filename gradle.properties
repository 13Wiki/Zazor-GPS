org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

kotlin.code.style=official

# Maven Central occasionally answers 429 behind a shared egress IP; retry with backoff.
systemProp.org.gradle.internal.repository.max.tentatives=10
systemProp.org.gradle.internal.repository.initial.backoff=2000

# AdMob. These defaults are Google's official *test* identifiers: a build without the owner's real
# ones still runs and shows test ads instead of crashing or, worse, serving live ads from a
# development build - which gets an AdMob account suspended. Override in local.properties or on the
# command line before a release build.
zazor.admob.appId=ca-app-pub-3940256099942544~3347511713
zazor.admob.bannerUnitId=ca-app-pub-3940256099942544/6300978111
